<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Form</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4;">
  <h2>Enter Employee Details</h2>
  <form action="/insertOne" method="POST">
    <label>Name: <input name="name" type="text" required></label><br><br>
    <label>Age: <input name="age" type="number" min="1" required></label><br><br>
    <label>Gender:
      <select name="gender" required>
        <option value="">Select</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
      </select>
    </label><br><br>
    <label>Salary: <input name="salary" type="number" min="0" step="0.01" required></label><br><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
